
<div class="row" style="height: 56px">
    <app-settings-drawer>
    </app-settings-drawer>
</div>

<main class="menu-container">

        <div class="row">

            <a href="https://angular.io" target="_blank">
                <img src="../../assets/logtower.svg" class="logo" alt="App logo" />
            </a>

            <div class="column">
                <h1 style="margin-bottom: 0.4rem">Welcome to Logtower!</h1>
                @if (failedShortcuts().length) {
                    <p class="hotkey-warning">
                        <img src="../../assets/warning.svg" alt="Warning" width="22" height="22" />
                        <span><b>{{ failedShortcuts().join(', ') }}</b> couldn't be registered — another app may be using it. Close it and restart Logtower.</span>
                    </p>
                } @else {
                    <p>Press <i><b>Ctrl+Space</b></i> and log your logs!</p>
                }
            </div>

        </div>

        <div class="menu">
            <button class="menu-btn" (click)="goToView()"> Browse Logs </button>
            <button class="menu-btn" (click)="goToManage()"> Manage Projects </button>
            <button class="menu-btn" (click)="quitApp()" style="background: var(--logtower-red)"> Quit </button>
        </div>

</main>
