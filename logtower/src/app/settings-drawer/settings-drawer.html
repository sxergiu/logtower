<div>
    <!-- Drawer toggle (top level, unaffected) -->
    <div style="display: flex; justify-content: flex-start; height: 100%">
        <div class="drawer-toggle" (click)="toggleDrawer()">
            <span [class.rotated]="drawerOpen">➤</span>
        </div>
    </div>

    <!-- Backdrop and left-side warnings (rendered only when open) -->
    @if (drawerOpen) {
        <div class="modal-backdrop"></div>

        <div class="warning-container">
            @if (showWarning()) {
                <div class="warning-banner">
                    <div class="svg-icon svg-wood" style="align-self: center">
                        <img [ngSrc]="'../../assets/warning.svg'"
                             alt="Toggle" width="22" height="22">
                    </div>
                    Invalid active setup. Logging is disabled
                </div>
            }
            @if (showWarning()) {
                <div class="warning-banner">
                    <div class="svg-icon svg-wood" style="align-self: center">
                        <img [ngSrc]="'../../assets/warning.svg'"
                             alt="Toggle" width="22" height="22">
                    </div>
                    <a> No projects or tasks? Create some here! </a>
                </div>
            }
        </div>
    }

    <!-- Drawer -->
    <div class="drawer" [class.open]="drawerOpen">
        <div class="drawer-content">
            <app-settings></app-settings>
        </div>
    </div>
</div>
