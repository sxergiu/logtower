<div>
    <!-- Drawer toggle (top level, unaffected) -->
    <div style="display: flex; justify-content: flex-start; height: 100%">
        <div class="drawer-toggle" (click)="toggleDrawer()">
            <span [class.rotated]="drawerOpen">➤</span>
        </div>
    </div>

    <!-- Backdrop and left-side warnings (rendered only when open) -->
    @if (drawerOpen) {
        <div class="modal-backdrop"></div>

        <div class="warning-container">
            @if (showNoProjectsWarning()) {
                <div class="warning-banner">
                    <div class="svg-icon svg-wood-no-hover" style="align-self: center;">
                            <img [ngSrc]="'../../assets/warning.svg'"
                                 alt="Toggle" width="22" height="22" style="margin-right: 0.5rem; align-self: center;">
                            <a (click)="goToManage()" class="create-link">
                                No projects or tasks? Create some <span class="link-text">here</span>!
                            </a>
                    </div>
                </div>
            }
            @if (showProjectsWithNoTasksWarning()) {
                <div class="warning-banner">
                    <div class="svg-icon svg-wood-no-hover" style="align-self: center">
                        <img [ngSrc]="'../../assets/warning.svg'"
                             alt="Toggle" width="22" height="22" style="margin-right: 0.5rem; align-self: center;">
                    Having a project with no tasks is kind of pointless, isn't it?
                    </div>
                </div>
            }
            @if (showWarning()) {
                <div class="warning-banner">
                    <div class="svg-icon svg-wood-no-hover" style="align-self: center">
                        <img [ngSrc]="'../../assets/warning.svg'"
                             alt="Toggle" width="22" height="22" style="margin-right: 0.5rem; align-self: center;">
                    Please select a valid setup to enable logging.
                    </div>
                </div>
            }
        </div>
    }

    <!-- Drawer -->
    <div class="drawer" [class.open]="drawerOpen">
        <div class="drawer-content">
            <app-settings (noProjects)="onNoProjectsAvailable($event)"
                          (noTasksProject)="onProjectsWithNoTask($event)"></app-settings>
        </div>
    </div>
</div>
