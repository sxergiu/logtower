
<div class="row">
    <button (click)="goToDashboard()" class="logs-btn svg-white">
        <div class="svg-icon">
            <img ngSrc="assets/back-arrow.svg" alt="Go Back" width="20" height="20">
        </div>
    </button>
    <div class="page-header">
        <h2>Log Viewer</h2>
        <span>This where all your logs end up!</span>
    </div>
</div>


<div class="log-container">
    <div class="table-wrapper">
        <table class="log-table">
            <thead>
            <tr>
                <th>Time</th>
                <th>Project</th>
                <th>Task</th>
                <th>Message</th>
            </tr>
            </thead>
            <tbody>
                @for (log of logs(); track log.id) {
                    <tr class="log-row">
                        <td class="timestamp">
                            <div class="time-primary">{{ formatTime(log.timestamp) }}</div>
                            <div class="time-secondary">{{ formatDate(log.timestamp) }}</div>
                        </td>
                        <td class="project">
                            <span class="project-badge">{{ log.projectName }}</span>
                        </td>
                        <td class="task">{{ log.taskName }}</td>
                        <td class="message">{{ log.message }}</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>

    <div class="row">

        @if( logs().length !== 0 ) {
                <button
                        (click)="deleteLogs()"
                        class="delete-logs-btn"
                >
                    <div class="svg-icon">
                        <img ngSrc="assets/trashcan.svg" alt="Delete" width="20" height="20">
                    </div>
                </button>
        }
    </div>
</div>
