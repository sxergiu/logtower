
<div class="row">
    <button (click)="goToDashboard()" class="logs-btn"> 🡸 </button>
    <h2 class="text-xl font-bold">Log Viewer</h2>
</div>

      <ul class="space-y-2">
          @if( logs.length === 0 ) {
              <strong> No available logs. </strong>
          }
          @for ( log of logs; track log.id ) {
                <li class="border p-2 rounded shadow-sm">
                  <strong>Time:</strong> {{ log.timestamp }}
                    -
                  <strong>Message:</strong> {{ log.message }}
                </li>
          }
      </ul>


<div class="row">

    @if( logs.length !== 0 ) {
        <div>
            <button
                    (click)="deleteLogs()"
                    class="delete-logs-btn"
            >
               Delete
            </button>
        </div>
    }
        <div>
            <button
                    (click)="loadLogs()"
                    class="logs-btn"
            >
                Refresh
            </button>
        </div>
</div>
