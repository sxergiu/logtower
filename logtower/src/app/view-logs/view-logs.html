
<div class="row">
    <button (click)="goToDashboard()" class="logs-btn"> < </button>
    <h2 class="text-xl font-bold">Log Viewer</h2>
</div>


<div class="log-container">
    <div class="table-wrapper">
        <table class="log-table">
            <thead>
            <tr>
                <th>Time</th>
                <th>Project</th>
                <th>Task</th>
                <th>Message</th>
            </tr>
            </thead>
            <tbody>
                @for (log of logs(); track log.id) {
                    <tr class="log-row">
                        <td class="timestamp">
                            <div class="time-primary">{{ formatTime(log.timestamp) }}</div>
                            <div class="time-secondary">{{ formatDate(log.timestamp) }}</div>
                        </td>
                        <td class="project">
                            <span class="project-badge">{{ log.projectName }}</span>
                        </td>
                        <td class="task">{{ log.taskName }}</td>
                        <td class="message">{{ log.message }}</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>

    <div class="row">

        @if( logs().length !== 0 ) {
                <button
                        (click)="deleteLogs()"
                        class="delete-logs-btn"
                >
                    <div style="display: flex">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"></path>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                        </svg>
                    </div>
                </button>
        }
        <div>
            <button
                    (click)="loadLogs()"
                    class="logs-btn"
            >
                Refresh
            </button>
        </div>
    </div>
</div>
