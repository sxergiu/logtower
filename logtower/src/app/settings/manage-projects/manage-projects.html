<div class="row">
    <button (click)="goToSettings()" class="logs-btn">
        <div class="svg-icon">
            <img ngSrc="assets/back-arrow.svg" alt="Go Back" width="20" height="20">
        </div>
    </button>
    <h2 class="text-xl font-bold"> Log Manager </h2>
</div>

<div class="log-manager-container">
    <div class="log-manager-card">
        <h2>Add Project</h2>
        <div class="add-section">
<!--            <input-->
<!--                    [ngModel]="newProjectName()"-->
<!--                    (ngModelChange)="newProjectName.set($event)"-->
            <input
                    placeholder="New project name"
                    (keyup.enter)="addProject()"
            />
            <button class="logs-btn">
                Add Project
            </button>

        </div>
    </div>

    @for( project of projects(); track project.id ) {
        <div class="log-manager-card">
          <h2>  {{project.name}} </h2>
            <div class="add-section">
                <input placeholder="New task name" />
                <button class="add-logs-btn">
                    Add Task
                </button>
            </div>


            @for ( task of tasksByProject()[project.id]; track task.id ) {
                <div class="task-list-item">
                    <span> {{task.name}} </span>
                    <button
                            class="delete-task-btn"
                    >
                        <div class="svg-icon">
                            <img ngSrc="assets/trashcan.svg" alt="Go Back" width="20" height="20">
                        </div>
                    </button>
                </div>
            }

            <button
                    class="delete-logs-btn"
            >
                <div class="svg-icon">
                    <img ngSrc="assets/trashcan.svg" alt="Go Back" width="20" height="20">
                </div>
            </button>

        </div>
    }
</div>
