
<div class="quick-log-container">
    <div class="row">
        <input
                #logInput
                class="add-log-input"
                [(ngModel)]="newMessage"
                placeholder="Enter log message"
                (keyup.enter)="addLog()"
                (keyup.esc)="closeWindow()"
        />
        <button
                class="add-log-btn"
                (click)="addLog()"
                [disabled]="!newMessage.trim()"
        >
            Add Log
        </button>
    </div>
</div>
