<div class="quick-log-window">
    <div class="quick-log-container">
        <div class="add-log-section">
            <input
                    #logInput
                    class="add-log-input"
                    [(ngModel)]="newMessage"
                    placeholder="Enter log message"
                    (keyup.enter)="addLog()"
                    (keyup.esc)="closeWindow()"
            />
            <button
                    class="add-log-btn"
                    (click)="addLog()"
                    [disabled]="!newMessage.trim() || pickedTaskId() === null"
            >
                Log
            </button>
        </div>
    </div>

    <div class="log-target subtle-text">
        <select [ngModel]="pickedProjectId()" (ngModelChange)="onProjectChange($event)" title="Project">
            @for (project of projectsWithTasks(); track project.id) {
                <option [ngValue]="project.id">{{ project.name }}</option>
            }
        </select>
        <select [ngModel]="pickedTaskId()" (ngModelChange)="onTaskChange($event)"
                [disabled]="!pickedTasks().length" title="Task">
            @for (task of pickedTasks(); track task.id) {
                <option [ngValue]="task.id">{{ task.name }}</option>
            }
        </select>
        @if (savedAsDefault()) {
            <span class="default-saved">&#10003; default</span>
        } @else if (differsFromDefault()) {
            <button type="button" class="set-default-btn" (click)="setAsDefault()">set as default</button>
        }
    </div>
</div>
