
<div class="quick-log-container">
    <div class="row">
        <input
                class="add-log-input"
                [(ngModel)]="newMessage"
                placeholder="Enter log message"

        />
        <button
                class="add-log-btn"
                (click)="addLog()"
                [disabled]="!newMessage.trim()"
        >
            Add Log
        </button>
    </div>
</div>
