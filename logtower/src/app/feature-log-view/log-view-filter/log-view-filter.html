


@if( showFilters ) {
    <div class="filter-container">

        <div class="filter-bar">
            <div style="display: flex; width: 100%; justify-content: flex-end">

                <button (click)="toggleFilters()" class="icon-btn svg-wood"
                        [title]="showFilters ? 'Hide filters' : 'Show filters'">
                    <div class="svg-icon">
                        <img [ngSrc]="showFilters ? '../../assets/eye-on.svg' : '../../assets/eye-off.svg'"
                             alt="Toggle actions" width="24" height="24">
                    </div>
                </button>

            </div>
            <div class="filter-dropdowns">
                <span>Project</span>
                <select
                        [ngModel]="defaultProject()()"
                        [compareWith]="projectCompare"
                        (ngModelChange)="onProjectSelected($event)"
                >
                    @for( project of projects(); track project.id) {
                        @if(tasks()[project.id].length !== 0) {
                            <option [ngValue]="project">{{ project.name}} </option>
                        }
                    }

                </select>

                <div class="filter-space"></div>
                @if( selectedProjectValue ) {
                    <span>Task</span>
                    <select
                            [ngModel]="defaultTask()()"
                            [compareWith]="taskCompare"
                            (ngModelChange)="onTaskSelected($event)"

                    >
                            @for (task of tasks()[selectedProjectValue.id]; track task.id) {
                                <option [ngValue]="task">{{ task.name }}</option>
                            }
                    </select>
                }

<!--                @if( selectedProjectValue ) {-->
<!--                    <button (click)="clearFilters()" class="icon-btn svg-red"-->
<!--                            [title]="'Clear filters'">-->
<!--                        <div class="svg-icon">-->
<!--                            <img [ngSrc]="'../../assets/cancel.svg'"-->
<!--                                 alt="Toggle actions" width="24" height="24">-->
<!--                        </div>-->
<!--                    </button>-->
<!--                }-->

            </div>
        </div>
    </div>
} @else {

    <div class="filter-container">
        <div (click)="toggleFilters()" class="no-filter-bar">
            <button class="icon-btn svg-wood"
                    [title]="showFilters ? 'Hide filters' : 'Show filters'">
                <div class="svg-icon">
                    <img [ngSrc]="showFilters ? '../../assets/eye-on.svg' : '../../assets/eye-off.svg'"
                         alt="Toggle actions" width="24" height="24">
                </div>
            </button>
        </div>
    </div>

}
