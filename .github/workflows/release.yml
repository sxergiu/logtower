name: release

on:
  # Only when this file changes: builds every installer without publishing
  # anything, so a change to the release build is tested before a release needs it.
  pull_request:
    paths: ['.github/workflows/release.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          # 22.04 rather than latest: an AppImage only runs on a glibc at least
          # as new as the one it was built against.
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: logtower/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: logtower/src-tauri
      - run: npm ci
        working-directory: logtower
      # beforeBuildCommand in tauri.conf.json runs the frontend build.
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: logtower
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ strategy.job-index }}
          path: logtower/src-tauri/target/**/release/bundle/
          retention-days: 7
